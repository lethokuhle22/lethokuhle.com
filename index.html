<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - My Personal Website</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <style>
        /* Body */
       body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow-x: hidden;
    color: #eee;

    /* Dark Tech Pattern Background */
    background-color: #0b0f1a;
    background-image:
        radial-gradient(circle at 1px 1px, rgba(59,130,246,0.15) 1px, transparent 0),
        linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px),
        linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px);
    background-size: 40px 40px, 80px 80px, 80px 80px;
}

                /* ================= FLOATING SIDEBAR ================= */
        .sidebar {
            width: 240px;
            height: 690px;
            background: rgba(0, 80, 255, 0.15);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59,130,246,0.4);
            border-radius: 20px;
            position: fixed;
            top: 80px;
            left: 20px; /* DETACHED FROM EDGE */
            z-index: 10;
            box-shadow: 0 0 30px rgba(59,130,246,0.5);
            padding-bottom: 10px;
            transition: width 0.25s ease, left 0.25s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar .nav-link {
            color: #cbd5f5;
            font-weight: 500;
            padding: 12px 16px;
            margin: 6px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            transition: 0.2s ease;
        }

        .sidebar .nav-link:hover {
            background: rgba(59,130,246,0.25);
            color: #3b82f6 !important;
            transform: translateX(6px);
        }

        .sidebar .nav-link.active {
            background: #3b82f6;
            color: white !important;
        }

        .sidebar .nav-link i {
            margin-right: 12px;
            font-size: 18px;
            color: #94a3b8;
        }

        .sidebar.collapsed .nav-link span {
            display: none;
        }

        .sidebar .nav-link:hover i {
            color: #3b82f6;
        }

        /* Toggle button */
        .toggle-btn {
            color: #ddd;
            cursor: pointer;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(59,130,246,0.3);
        }

                .sidebar.collapsed ~ .content {
            margin-left: 120px;
        }
.sidebar.collapsed .nav-link {
    position: relative;
}

.sidebar.collapsed .nav-link::after {
    content: attr(data-title);
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 100, 255, 0.85);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
    box-shadow: 0 0 12px rgba(59,130,246,0.8);
}

/* Show tooltip on hover */
.sidebar.collapsed .nav-link:hover::after {
    opacity: 1;
    left: 90px;
}

        /* Hero section */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            text-align: center;
        }

       footer {
    color: #bbb;
    text-align: center;
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid rgba(59,130,246,0.3);

/* ================= MAIN CONTENT ================= */
        .content {
            margin-left: 300px; /* space for floating sidebar */
            padding: 40px;
            min-height: 100vh;
            position: relative;
            z-index: 5;
            transition: margin-left 0.3s;
        }


}
    </style>
</head>

<body>

      <!-- FLOATING SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="toggle-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </div>

       <ul class="nav flex-column">
    <li class="nav-item">
        <a class="nav-link" href="index.html" data-title="Home">
            <i class="fas fa-home"></i><span> Home</span>
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="about.html" data-title="About Me">
            <i class="fas fa-user"></i><span> About Me</span>
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="projects.html" data-title="Projects">
            <i class="fas fa-code"></i><span> Projects</span>
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="resume.html" data-title="Resume">
            <i class="fas fa-file-alt"></i><span> Resume</span>
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="contact.html" data-title="Contact">
            <i class="fas fa-envelope"></i><span> Contact</span>
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="skills.html" data-title="Skills">
            <i class="fas fa-lightbulb"></i><span> Skills</span>
        </a>
    </li>
</ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="hero-section">
            <h1 style="font-size: 3.5rem; color: #1e90ff; text-shadow: 0 0 15px #1e90ff;">
                Welcome to My Portfolio
            </h1>

            <p class="lead">Junior Full stack developer | Systems Analyst</p>
            <p class="lead">Computer Science & IT Graduate</p>

            <div class="mt-4">
                <a href="projects.html" class="btn btn-outline-primary btn-lg">View My Work</a>
            </div>
        </div>

       

<footer>
    <p>&copy; 2026 - My Personal Website</p>
</footer>    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
    </script>

</body>
</html>
