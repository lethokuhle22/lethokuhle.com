<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - My Personal Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        /* Body background for stars */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: black;
            color: #eee;
        }

        /* Star layers */
        .stars, .stars2, .stars3 {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: transparent;
        }

        .stars::before, .stars2::before, .stars3::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-repeat: repeat;
            background-size: 50px 50px;
            animation: moveStars linear infinite;
        }

        .stars::before { background-image: radial-gradient(white 1px, transparent 1px); animation-duration: 100s; }
        .stars2::before { background-image: radial-gradient(white 1px, transparent 1px); animation-duration: 150s; }
        .stars3::before { background-image: radial-gradient(white 1px, transparent 1px); animation-duration: 200s; }

        @keyframes moveStars {
            from { transform: translate(0, 0); }
            to { transform: translate(-1000px, 1000px); }
        }

        /* Sidebar styling */
        .sidebar {
    width: 260px;
    min-height: 100vh;
    background: rgba(10, 15, 35, 0.75);
    backdrop-filter: blur(14px);
    border-right: 1px solid rgba(59,130,246,0.25);
    transition: width 0.25s ease;
    position: fixed;
    z-index: 10;
    box-shadow: 0 0 25px rgba(59,130,246,0.15);
}
        .sidebar.collapsed { width: 70px; }

        .sidebar .nav-link {
    color: #cbd5f5;
    font-weight: 500;
    padding: 12px 16px;
    margin: 6px 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    transition: 0.2s ease;
}

        .sidebar .nav-link:hover {
    background: rgba(59,130,246,0.15);
    color: #3b82f6 !important;
    transform: translateX(6px);
}

.sidebar .nav-link.active {
    background: #3b82f6;
    color: white !important;
}

        .sidebar .nav-link i {
    margin-right: 12px;
    font-size: 18px;
    color: #94a3b8;
}
        .sidebar.collapsed .nav-link span { display: none; }

        .sidebar .nav-link:hover i {
    color: #3b82f6;
}

        .sidebar a:hover span { transform: translateX(10px); color: #00ff7f; }

        /* Content styling */
        .content {
            margin-left: 250px;
            padding: 40px;
            transition: margin-left 0.3s;
            min-height: 100vh;
            position: relative;
            z-index: 5;
        }

        .sidebar.collapsed ~ .content { margin-left: 70px; }

        .toggle-btn {
            color: #ddd;
            cursor: pointer;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #495057;
        }

        footer {
            color: #bbb;
            text-align: center;
            margin-top: 50px;
        }

        /* Home Page Specific Hero Styling */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <div class="sidebar" id="sidebar">
	  <div class="toggle-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="index.html" data-title="Home"><i class="fas fa-home"></i><span> Home</span></a></li>
            <li class="nav-item"><a class="nav-link" href="about.html" data-title="About Me"><i class="fas fa-user"></i><span> About Me</span></a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html" data-title="Projects"><i class="fas fa-code"></i><span> Projects</span></a></li>
            <li class="nav-item"><a class="nav-link" href="resume.html" data-title="Resume"><i class="fas fa-file-alt"></i><span> Resume</span></a></li>
            <li class="nav-item"><a class="nav-link" href="blog.html" data-title="Blog"><i class="fas fa-blog"></i><span> Blog</span></a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html" data-title="Contact"><i class="fas fa-envelope"></i><span> Contact</span></a></li>
            <li class="nav-item"><a class="nav-link" href="skills.html" data-title="Skills"><i class="fas fa-lightbulb"></i><span> Skills</span></a></li>
        </ul>
    </div>

    <div class="content">
        <div class="hero-section">
            <h1 style="font-size: 3.5rem; color: #1e90ff; text-shadow: 0 0 15px #1e90ff;">Welcome to My Portfolio</h1>
            <p class="lead">Data Analyst | Software developer | Systems Analyst</p>
	    <p class="lead">             Computer Science & IT graduate</p>
            <div class="mt-4">
                <a href="projects.html" class="btn btn-outline-primary btn-lg">View My Work</a>
            </div>
        </div>

        <hr />
        <footer>
            <p>&copy; 2026 - My Personal Website</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
    </script>
</body>
</html>
