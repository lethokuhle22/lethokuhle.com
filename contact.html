<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <style>
       body {
    background-color: #111;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    color: #eee;
}
          /* ================= FLOATING SIDEBAR ================= */
        .sidebar {
            width: 240px;
            height: 690px;
            background: rgba(0, 80, 255, 0.15);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59,130,246,0.4);
            border-radius: 20px;
            position: fixed;
            top: 80px;
            left: 20px; /* DETACHED FROM EDGE */
            z-index: 10;
            box-shadow: 0 0 30px rgba(59,130,246,0.5);
            padding-bottom: 10px;
            transition: width 0.25s ease, left 0.25s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar .nav-link {
            color: #cbd5f5;
            font-weight: 500;
            padding: 12px 16px;
            margin: 6px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            transition: 0.2s ease;
        }

        .sidebar .nav-link:hover {
            background: rgba(59,130,246,0.25);
            color: #3b82f6 !important;
            transform: translateX(6px);
        }

        .sidebar .nav-link.active {
            background: #3b82f6;
            color: white !important;
        }

        .sidebar .nav-link i {
            margin-right: 12px;
            font-size: 18px;
            color: #94a3b8;
        }

        .sidebar.collapsed .nav-link span {
            display: none;
        }

        .sidebar .nav-link:hover i {
            color: #3b82f6;
        }

        /* Toggle button */
        .toggle-btn {
            color: #ddd;
            cursor: pointer;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(59,130,246,0.3);
        }

                .sidebar.collapsed ~ .content {
            margin-left: 120px;
        }
.sidebar.collapsed .nav-link {
    position: relative;
}

.sidebar.collapsed .nav-link::after {
    content: attr(data-title);
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 100, 255, 0.85);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
    box-shadow: 0 0 12px rgba(59,130,246,0.8);
}

/* Show tooltip on hover */
.sidebar.collapsed .nav-link:hover::after {
    opacity: 1;
    left: 90px;
}


/* BASE CONTAINER */
.about-container {
    max-width: 900px;
    margin: 0 auto;
    background-color: rgba(20, 20, 40, 0.85);
    padding: 25px;
    border-radius: 10px;
    color: #eee;
    border: 1px solid #00bfff;
    box-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
}

/* PAGE TITLE */
.page-title {
    text-align: center;
    font-size: 2.8rem;
    margin-bottom: 30px;
    color: #00bfff;
    text-shadow: 0 0 8px #00bfff, 0 0 15px rgba(0, 191, 255, 0.4);
}

/* SECTION STYLES */
.contact-section {
    margin-bottom: 30px;
}

.contact-section h2 {
    font-size: 1.8rem;
    margin-bottom: 15px;
    color: #00bfff;
    text-shadow: 0 0 5px #00bfff;
}

.contact-section p {
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 10px;
}

/* CONTACT INFO CARDS */
.contact-info-list {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-top: 20px;
}

.info-item {
    flex-basis: 45%;
    min-width: 250px;
    text-align: center;
    padding: 15px 10px;
    border-radius: 5px;
    border: 1px solid rgba(0, 191, 255, 0.4);
    margin: 5px;
    transition: all 0.3s;
}

/* CARD HOVER EFFECT */
.info-item:hover {
    background-color: rgba(0, 191, 255, 0.1);
    box-shadow: 0 0 12px rgba(0, 191, 255, 0.7);
    transform: translateY(-2px);
}

/* ICONS */
.info-item .icon {
    font-size: 1.8rem;
    display: block;
    margin-bottom: 5px;
    color: #00bfff;
}

/* ADDRESS */
.address-details p {
    margin-bottom: 5px;
    padding-left: 15px;
}

/* SEPARATOR LINE */
.separator {
    border: 0;
    height: 1px;
    background-image: linear-gradient(
        to right,
        rgba(0, 0, 0, 0),
        rgba(0, 191, 255, 0.7),
        rgba(0, 0, 0, 0)
    );
    margin: 40px 0;
}
    </style>
</head>
<body>
 <!-- FLOATING SIDEBAR -->

       <ul class="nav flex-column">

        </a>
    </li>

    <li class="nav-item">

    </li>

    <li class="nav-item">
        <a class="nav-link" href="skills.html" data-title="Skills">

        </a>
    </li>
</ul>
    </div>
<div class="content">

        <div class="contact-section">
            <h2>Get In Touch</h2>
            <div class="contact-info-list">
                <div class="info-item">
                    <span class="icon">📞</span>

        <hr class="separator" />

        <div class="contact-section address-section">

</div>
<script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');

</body>
