<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #eee;
        }

        /* BASE CONTAINER STYLES */
        .about-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: rgba(20, 20, 40, 0.85);
            padding: 25px;
            border-radius: 10px;
            color: #eee;
            box-shadow: 0 0 15px rgba(0, 255, 127, 0.6); 
        }

        /* TYPOGRAPHY STYLES */
        .page-title {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 30px;
            color: #00ff7f;
            text-shadow: 0 0 8px #00ff7f, 0 0 15px rgba(0, 255, 127, 0.4);
        }

        .contact-section {
            margin-bottom: 30px;
        }

        .contact-section h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #1fff6b;
            text-shadow: 0 0 5px #1fff6b;
        }

        .contact-section p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        /* DIRECT CONTACT INFO STYLES */
        .contact-info-list {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .info-item {
            flex-basis: 45%; 
            min-width: 250px; 
            text-align: center;
            padding: 15px 10px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 127, 0.3);
            margin: 5px;
            transition: all 0.3s;
        }

        .info-item:hover {
            background-color: rgba(0, 255, 127, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 127, 0.5);
            transform: translateY(-2px);
        }

        .info-item .icon {
            font-size: 1.8rem; 
            display: block;
            margin-bottom: 5px;
            color: #00ff7f; 
        }

        /* ADDRESS STYLES */
        .address-details p {
            margin-bottom: 5px;
            padding-left: 15px;
        }

        /* Separator */
        .separator {
            border: 0;
            height: 1px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 255, 127, 0.7), rgba(0, 0, 0, 0));
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <div class="about-container">
        <h1 class="page-title">Contact Information 📧</h1>

        <div class="contact-section">
            <h2>Get In Touch</h2>
            <div class="contact-info-list">
                <div class="info-item">
                    <span class="icon">📞</span>
                    <strong>Phone:</strong> (+27) 64 892 1815
                </div>
                <div class="info-item">
                    <span class="icon">📧</span>
                    <strong>Email:</strong> bsisanda230@gmail.com
                </div>
            </div>
        </div>

        <hr class="separator" />

        <div class="contact-section address-section">
            <h2>Location</h2>
            <div class="address-details">
                <p><strong>Physical Address:</strong></p>
                <p>Street: 6490 Bulawayo RD</p>
                <p>Suburb: France Foxhill Phase 4</p>
                <p>City: Pietermaritzburg</p>
                <p>City code: 3201</p>
            </div>
        </div>
    </div>
</body>
</html>
