<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>
    <style>
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: white;
        }

        .skills-page {
            width: 100%;
            padding: 30px;
            color: white;
        }

        .skills-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 40px;
            color: #4da6ff;
            text-shadow: 0 0 10px #4da6ff;
        }

        .skills-section {
            margin-bottom: 40px;
        }

        .skills-category {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #99ccff;
            text-shadow: 0 0 5px #99ccff;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .skill-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.1rem;

            border: 1px solid #1a3a5f;
            box-shadow: 0 0 10px rgba(77, 166, 255, 0.2);

            transition: transform 0.3s ease, 
                        box-shadow 0.3s ease,
                        background 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            background: rgba(77, 166, 255, 0.2);
            box-shadow: 0 0 15px #4da6ff;
        }
    </style>
</head>
<body>
    <div class="skills-page">

        <h1 class="skills-title">Skills</h1>

        <div class="skills-section">
            <h2 class="skills-category">Programming Languages</h2>
            <div class="skills-grid">
                <div class="skill-card">C++</div>
                <div class="skill-card">C#</div>
                <div class="skill-card">Java</div>
                <div class="skill-card">Python</div>
            </div>
        </div>

        <div class="skills-section">
            <h2 class="skills-category">Web & Frameworks</h2>
            <div class="skills-grid">
                <div class="skill-card">ASP.NET</div>
                <div class="skill-card">HTML / CSS / JS</div>
                <div class="skill-card">Bootstrap</div>
            </div>
        </div>

        <div class="skills-section">
            <h2 class="skills-category">Tools & Technologies</h2>
            <div class="skills-grid">
                <div class="skill-card">Visual Studio</div>
                <div class="skill-card">MySQL</div>
                <div class="skill-card">SQL Server</div>
                <div class="skill-card">Git & GitHub</div>
                <div class="skill-card">SFML</div>
                <div class="skill-card">OpenCV</div>
            </div>
        </div>

        <div class="skills-section">
            <h2 class="skills-category">Soft Skills</h2>
            <div class="skills-grid">
                <div class="skill-card">Problem Solving</div>
                <div class="skill-card">Teamwork</div>
                <div class="skill-card">Communication</div>
                <div class="skill-card">Time Management</div>
            </div>
        </div>

    </div>
</body>
</html>
